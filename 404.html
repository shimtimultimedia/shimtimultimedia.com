<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Content Security Policy.
       Delivered as a meta element because GitHub Pages cannot set response headers. That
       is weaker than the header form on purpose-of-record: the policy only takes effect
       once the parser reaches this tag, and frame-ancestors, report-uri and sandbox are
       ignored entirely in meta form. It is placed immediately after charset - which must
       come first for the parser to decode the document correctly - and before anything
       that fetches, so every resource this page loads is covered. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Lost | Shimti Multimedia</title>
  <meta name="description" content="The page you requested could not be found.">
  <!-- Error pages must never be indexed: they are not content, and letting them into
       search results creates dead entries pointing at nothing. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/images/favicon/favicon.svg" type="image/svg+xml">
  <style>
    /* The same variable WOFF2 the rest of the site uses. Declared inline because this
       page is deliberately self-contained: an error page that depends on another
       request to render is an error page that fails when that request is what broke. */
    @font-face {
      font-family: 'Orbitron';
      src: url('assets/fonts/Orbitron-Variable.woff2') format('woff2');
      font-weight: 400 900;
      font-display: swap;
    }

    :root {
      --text-color: #eaffff;
      --panel-bg: rgba(180, 220, 255, 0.15);
      --border-color: #fff;
      --focus-outline: #8cf;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #000;
      color: var(--text-color);
      font-family: 'Orbitron', sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 18vw, 8rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      line-height: 1;
      animation: glowPulse 3s ease-in-out infinite;
    }

    p {
      margin: 0;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      letter-spacing: 0.1em;
      max-width: 32ch;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--panel-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-color);
      text-decoration: none;
      letter-spacing: 0.1em;
      transition: background 0.3s ease;
    }

    a:hover,
    a:focus-visible {
      background: rgba(180, 220, 255, 0.35);
    }

    a:focus-visible {
      outline: 3px solid var(--focus-outline);
      outline-offset: 3px;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 8px rgba(180, 220, 255, 0.35); }
      50%      { text-shadow: 0 0 22px rgba(180, 220, 255, 0.7); }
    }

    /* Honour the OS reduce-motion setting (WCAG 2.1 SC 2.3.3). */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Signal lost. This coordinate does not exist.</p>
    <a href="./">Return to base</a>
  </main>
</body>
</html>
