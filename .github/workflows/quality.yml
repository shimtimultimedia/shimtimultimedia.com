# Fast, deterministic quality gate.
#
# Runs on every push and pull request. Everything here is hermetic: no external network
# calls, so a failure always means this repository changed, never that someone else's
# server was down. A gate that fails randomly gets ignored, and an ignored gate protects
# nothing - so anything flaky lives in audit.yml instead.
name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: only the newest commit's result matters.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  html:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Rules are configured in .htmlvalidate.json. doctype-style is pinned to this
      # repository's existing convention rather than disabled, so the rule still
      # enforces internal consistency.
      - name: Validate HTML
        run: npx --yes html-validate@11 *.html


      # A page without the door markup does not error - it just loses the airlock in one
      # direction and keeps it in the other, which reads as a glitch rather than as a
      # missing feature. And a second page claiming to be the machinery would make the
      # airlock fire on the wrong journeys. Both are cheap to assert and silent to miss.
      - name: Every page carries the door contract
        run: |
          fail=0
          # Every page except the error page, found rather than listed. A hand-written list
          # silently stops covering the site the moment a page is added - which is exactly
          # when the contract most needs checking.
          for f in $(ls *.html | grep -v '^404.html$'); do
            grep -q 'data-page="' "$f"             || { echo "::error file=$f::missing data-page on <html>"; fail=1; }
            grep -q 'class="door door-left"' "$f"  || { echo "::error file=$f::missing left door"; fail=1; }
            grep -q 'class="door door-right"' "$f" || { echo "::error file=$f::missing right door"; fail=1; }
            grep -q 'styles/doors.css' "$f"        || { echo "::error file=$f::doors.css not linked"; fail=1; }
            grep -q 'scripts/doors.js' "$f"        || { echo "::error file=$f::doors.js not linked"; fail=1; }
          done
          # Exactly one page is the machinery; the airlock is defined by crossing to it.
          homes=$(grep -l 'data-page="home"' *.html | wc -l)
          test "$homes" -eq 1 || { echo "::error::exactly one page may be data-page=home, found $homes"; fail=1; }
          grep -q 'data-page="home"' index.html || { echo "::error::index.html must be data-page=home"; fail=1; }
          test "$fail" -eq 0 || exit 1
          echo "All pages carry the door contract."

  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --offline resolves links against the checked-out files only, so this catches a
      # renamed or deleted page immediately without depending on the public internet.
      # External URLs are checked on a schedule in audit.yml.
      - name: Check internal links and fragments
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            .
          fail: true

  canonical-host:
    name: Canonical host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every absolute URL the site serves must name one host.
      #
      # The domain appears 40-odd times across the pages, the sitemap and robots.txt -
      # canonical, og:url, og:image, twitter:image, the JSON-LD block, every <loc>. A
      # migration that misses one of them produces the worst kind of failure: nothing
      # errors, the page renders, and a canonical or an og:image quietly points at a host
      # that either redirects or does not resolve. Search engines and link scrapers act on
      # exactly those tags.
      #
      # So the invariant is asserted rather than trusted: the old host must appear in
      # nothing that is served. Docs are excluded on purpose - LAUNCH.md has to be able to
      # name the old host to describe the DNS records.
      - name: No stale host in served files
        run: |
          if grep -rn "shimtimultimedia\.github\.io" \
               --include='*.html' --include='*.xml' --include='*.txt' .; then
            echo "::error::Old host still referenced in a served file - the domain migration is incomplete."
            exit 1
          fi
          echo "All served absolute URLs use the canonical host."

      # A CNAME with a carriage return in it is a domain with a carriage return in it, and
      # GitHub Pages will simply fail to match it.
      - name: CNAME is a single clean line
        run: |
          # Conditional on the file existing, deliberately. The custom domain is
          # staged: the rebased URLs land before CNAME does, because committing CNAME is
          # what actually switches Pages over, and that must not happen until DNS
          # resolves. Requiring the file here would fail every build during that window,
          # and a gate that fails for a reason nobody can fix is one people learn to
          # ignore.
          if [ ! -f CNAME ]; then
            echo "No CNAME yet - custom domain not switched on. Skipping."
            exit 0
          fi
          if grep -q $'\r' CNAME; then
            echo "::error::CNAME contains a carriage return"; exit 1
          fi
          lines=$(wc -l < CNAME)
          test "$lines" -le 1 || { echo "::error::CNAME must be one line, found $lines"; exit 1; }
          echo "CNAME: $(cat CNAME)"

  frame-loop:
    name: Background frame loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The frame loop is the one part of the site nothing else exercises. A browser check
      # can report the canvas sized, the grid drawn and the lattice published while the
      # loop throws on every frame, because resize() paints once by itself - which is
      # exactly how a renamed drawImage argument shipped, threw 45 times a second, and
      # loaded a machine heavily enough to be noticed overnight.
      #
      # This drives the real renderer through real frames against a stub canvas: it fails
      # if any frame throws, and fails if eight simulated hours grow the heap.
      - name: Frame loop runs clean and does not leak
        run: node --expose-gc tests/background-frame-loop.test.mjs
