# Deep audit against the LIVE site.
#
# Deliberately separate from quality.yml. Everything here either touches the public
# internet (external link checking) or measures the deployed site, so it can fail for
# reasons unrelated to a given commit. Keeping it out of the push/PR path means the
# blocking gate stays trustworthy.
#
# Lighthouse runs against the deployed URL rather than a locally served copy on purpose:
# GitHub Pages serves compressed and CDN-cached responses, so a local run reports
# failures for uses-text-compression and document-latency that do not exist in
# production, and would force the thresholds to be set to meaningless values.
name: Audit

on:
  schedule:
    # Mondays 07:00 UTC. Cron on GitHub Actions is best-effort, not exact.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://shimtimultimedia.com/

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check all links including external
        uses: lycheeverse/lychee-action@v2
        with:
          # Retries absorb transient upstream failures; without them this reports other
          # people's momentary outages as our defects.
          #
          # 403 and 999 are accepted because the storefronts and social platforms this site
          # links to refuse any client that is not a browser. Checked from CI, LinkedIn
          # answers 999 and Fab, Redbubble, Threadless, Fiverr and Reddit answer 403 - none
          # of which means the page is missing, only that a robot asked. Treating those as
          # failures would break this run every week for a reason nobody can fix, and a gate
          # that fails for unfixable reasons is one people learn to ignore. 429 is rate
          # limiting, which is the same situation wearing a different number.
          #
          # The trade is explicit: a genuinely dead link on one of those hosts will not be
          # caught here. Everything self-hosted still is, and that is where our mistakes go.
          args: >-
            --no-progress
            --max-retries 3
            --timeout 20
            --exclude-mail
            --accept 200,206,301,302,403,429,999
            .
          fail: true

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Audit deployed site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ env.SITE_URL }}
          # Three runs, median reported. A single run on shared CI hardware is noisy
          # enough to cross a threshold by chance.
          runs: 3
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
